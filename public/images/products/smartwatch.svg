<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="swBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="swTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="swStrap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="swDial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="swPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#swBg)"/>
  <circle cx="300" cy="225" r="140" fill="#06b6d4" opacity="0.06"/>

  <!-- Top Watch Strap with ribbed silicone texture -->
  <path d="M260 40 L340 40 L335 150 L265 150 Z" fill="url(#swStrap)" stroke="#334155" stroke-width="2"/>
  <line x1="265" y1="65" x2="335" y2="65" stroke="#334155" stroke-width="2"/>
  <line x1="265" y1="90" x2="335" y2="90" stroke="#334155" stroke-width="2"/>
  <line x1="265" y1="115" x2="335" y2="115" stroke="#334155" stroke-width="2"/>

  <!-- Bottom Watch Strap -->
  <path d="M265 300 L335 300 L340 410 L260 410 Z" fill="url(#swStrap)" stroke="#334155" stroke-width="2"/>
  <line x1="265" y1="330" x2="335" y2="330" stroke="#334155" stroke-width="2"/>
  <line x1="265" y1="355" x2="335" y2="355" stroke="#334155" stroke-width="2"/>
  <line x1="265" y1="380" x2="335" y2="380" stroke="#334155" stroke-width="2"/>

  <!-- Titanium Bezel & Chassis -->
  <circle cx="300" cy="225" r="102" fill="url(#swTitanium)"/>
  <circle cx="300" cy="225" r="95" fill="#1e293b"/>
  
  <!-- Digital Crown on right -->
  <rect x="396" y="205" width="12" height="24" rx="3" fill="url(#swTitanium)" stroke="#334155" stroke-width="1"/>
  <line x1="400" y1="210" x2="400" y2="224" stroke="#0f172a" stroke-width="1"/>
  <line x1="404" y1="210" x2="404" y2="224" stroke="#0f172a" stroke-width="1"/>
  <!-- Secondary Action Button -->
  <rect x="394" y="240" width="8" height="18" rx="2" fill="url(#swTitanium)"/>

  <!-- Sapphire Display -->
  <circle cx="300" cy="225" r="88" fill="url(#swDial)" stroke="#0f172a" stroke-width="3"/>

  <!-- Dial Outer Rings & Gauges -->
  <circle cx="300" cy="225" r="80" fill="none" stroke="#1e293b" stroke-width="3"/>
  <circle cx="300" cy="225" r="80" fill="none" stroke="url(#swPulse)" stroke-width="4" stroke-dasharray="320 180" stroke-linecap="round"/>

  <!-- Heart Rate Pulse Graph -->
  <path d="M245 220 L265 220 L272 205 L280 235 L288 210 L295 228 L302 220 L355 220" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Clock & Stats Text -->
  <text x="300" y="185" text-anchor="middle" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" letter-spacing="1">10:42</text>
  <text x="300" y="200" text-anchor="middle" fill="#06b6d4" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="2">TITANIUM APEX</text>
  
  <text x="270" y="265" text-anchor="middle" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">♥ 74</text>
  <text x="270" y="278" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">BPM</text>

  <text x="330" y="265" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">98%</text>
  <text x="330" y="278" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">SPO2</text>

  <!-- Tag Pill -->
  <rect x="235" y="390" width="130" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="300" y="407" text-anchor="middle" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">GRADE-5 TITANIUM</text>
</svg>
