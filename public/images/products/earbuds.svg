<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ebBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="ebCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ebBud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#ebBg)"/>
  <circle cx="300" cy="220" r="130" fill="#38bdf8" opacity="0.06"/>

  <!-- Charging Case Bottom Base -->
  <rect x="210" y="190" width="180" height="130" rx="35" fill="url(#ebCase)" stroke="#475569" stroke-width="2.5"/>
  
  <!-- Opened Lid (Tilted back) -->
  <path d="M210 190 C210 130 390 130 390 190 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  
  <!-- LED Battery Status Indicators on Case -->
  <circle cx="280" cy="260" r="3" fill="#38bdf8"/>
  <circle cx="293" cy="260" r="3" fill="#38bdf8"/>
  <circle cx="306" cy="260" r="3" fill="#38bdf8"/>
  <circle cx="319" cy="260" r="3" fill="#38bdf8"/>

  <!-- Left Wireless Earbud (Floating above case) -->
  <g transform="translate(160, 110) rotate(-15)">
    <!-- Earbud Stem -->
    <rect x="18" y="30" width="14" height="60" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Charging contacts -->
    <circle cx="25" cy="82" r="2" fill="#e2e8f0"/>
    <!-- Sound Head -->
    <circle cx="25" cy="30" r="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Silicone In-ear Tip -->
    <ellipse cx="14" cy="30" rx="12" ry="16" fill="url(#ebBud)"/>
    <!-- Mic grille -->
    <circle cx="25" cy="48" r="2" fill="#64748b"/>
  </g>

  <!-- Right Wireless Earbud (Floating above case) -->
  <g transform="translate(350, 110) rotate(15)">
    <!-- Earbud Stem -->
    <rect x="18" y="30" width="14" height="60" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Charging contacts -->
    <circle cx="25" cy="82" r="2" fill="#e2e8f0"/>
    <!-- Sound Head -->
    <circle cx="25" cy="30" r="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Silicone In-ear Tip -->
    <ellipse cx="36" cy="30" rx="12" ry="16" fill="url(#ebBud)"/>
    <!-- Mic grille -->
    <circle cx="25" cy="48" r="2" fill="#64748b"/>
  </g>

  <!-- Spec Tag -->
  <rect x="225" y="380" width="150" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="300" y="397" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">18MS LOW LATENCY</text>
</svg>
