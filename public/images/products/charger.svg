<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="chgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121620"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="chgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chgMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#chgBg)"/>
  
  <!-- Weighted Base Station -->
  <ellipse cx="300" cy="350" rx="140" ry="35" fill="url(#chgBase)" stroke="#334155" stroke-width="2"/>
  
  <!-- Earbuds Qi Wireless Pad indent on base -->
  <ellipse cx="230" cy="345" rx="35" ry="15" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="230" cy="345" r="5" fill="#10b981" opacity="0.8"/>

  <!-- Steel Vertical Support Arm -->
  <path d="M340 340 C340 280 340 200 340 180" stroke="url(#chgMetal)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- MagSafe Floating Phone Charging Pad (Angled 45 deg) -->
  <g transform="translate(300, 160) rotate(-15)">
    <!-- Pad Disc -->
    <circle cx="0" cy="0" r="50" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="0,-6 4,0 0,6 -4,0" fill="#38bdf8"/>
  </g>

  <!-- Apple Watch Floating Magnetic Charger Arm (Left Branch) -->
  <path d="M340 230 C300 230 260 210 260 190" fill="none" stroke="url(#chgMetal)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="260" cy="190" r="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="260" cy="190" r="14" fill="#f1f5f9"/>

  <!-- Power Status LED strip on front -->
  <rect x="280" y="375" width="40" height="3" rx="1.5" fill="#10b981" opacity="0.9"/>

  <!-- Spec Tag -->
  <rect x="220" y="405" width="160" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="300" y="422" text-anchor="middle" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">15W MAGSAFE FAST CHARGE</text>
</svg>
