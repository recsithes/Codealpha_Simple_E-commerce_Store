<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="spkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121620"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="spkCab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="spkWoofer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#spkBg)"/>
  <circle cx="300" cy="230" r="140" fill="#f59e0b" opacity="0.05"/>

  <!-- Left Speaker Cabinet (Slight perspective tilt) -->
  <g transform="translate(-100, 0)">
    <!-- Shadow -->
    <ellipse cx="280" cy="380" rx="90" ry="18" fill="#000" opacity="0.4"/>
    <!-- Main Enclosure -->
    <rect x="200" y="80" width="160" height="290" rx="14" fill="url(#spkCab)" stroke="#334155" stroke-width="2.5"/>
    <!-- Front Baffle Bevel -->
    <rect x="210" y="90" width="140" height="270" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Silk Dome Tweeter with Waveguide -->
    <circle cx="280" cy="150" r="32" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="280" cy="150" r="16" fill="#020617" stroke="#475569" stroke-width="1.5"/>
    <circle cx="280" cy="150" r="8" fill="#0ea5e9"/>

    <!-- 5" Woven Kevlar Composite Woofer -->
    <circle cx="280" cy="265" r="54" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <circle cx="280" cy="265" r="46" fill="url(#spkWoofer)"/>
    <circle cx="280" cy="265" r="16" fill="#0f172a" stroke="#b45309" stroke-width="2"/>

    <!-- Bass Reflex Port -->
    <circle cx="280" cy="340" r="10" fill="#000" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- Right Speaker Cabinet -->
  <g transform="translate(140, 0)">
    <!-- Shadow -->
    <ellipse cx="280" cy="380" rx="90" ry="18" fill="#000" opacity="0.4"/>
    <!-- Main Enclosure -->
    <rect x="200" y="80" width="160" height="290" rx="14" fill="url(#spkCab)" stroke="#334155" stroke-width="2.5"/>
    <!-- Front Baffle Bevel -->
    <rect x="210" y="90" width="140" height="270" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Silk Dome Tweeter with Waveguide -->
    <circle cx="280" cy="150" r="32" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <circle cx="280" cy="150" r="16" fill="#020617" stroke="#475569" stroke-width="1.5"/>
    <circle cx="280" cy="150" r="8" fill="#0ea5e9"/>

    <!-- 5" Woven Kevlar Composite Woofer -->
    <circle cx="280" cy="265" r="54" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <circle cx="280" cy="265" r="46" fill="url(#spkWoofer)"/>
    <circle cx="280" cy="265" r="16" fill="#0f172a" stroke="#b45309" stroke-width="2"/>

    <!-- Volume Knob & Power LED on right active speaker -->
    <circle cx="280" cy="338" r="8" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="320" cy="338" r="2.5" fill="#10b981"/>
  </g>

  <!-- Spec Tag -->
  <rect x="225" y="405" width="150" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="300" y="422" text-anchor="middle" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">BI-AMPED REFERENCE</text>
</svg>
