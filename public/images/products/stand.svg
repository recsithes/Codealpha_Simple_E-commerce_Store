<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="stnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="stnAlu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#stnBg)"/>

  <!-- Shadow on desk surface -->
  <polygon points="120,380 480,380 440,350 160,350" fill="#000" opacity="0.4" filter="blur(10px)"/>

  <!-- Anodized Aluminum Stand (Z-shape Ergonomic Riser) -->
  <!-- Base Plate on desk -->
  <polygon points="140,360 460,360 430,320 170,320" fill="url(#stnAlu)" stroke="#334155" stroke-width="2"/>
  <!-- Non-slip silicone pads on base -->
  <rect x="180" y="345" width="45" height="8" rx="2" fill="#0f172a"/>
  <rect x="375" y="345" width="45" height="8" rx="2" fill="#0f172a"/>

  <!-- Dual Heavy-Duty Friction Pivot Hinges -->
  <!-- Left Hinge Column -->
  <path d="M190 320 L230 180" stroke="url(#stnAlu)" stroke-width="18" stroke-linecap="round"/>
  <!-- Right Hinge Column -->
  <path d="M410 320 L370 180" stroke="url(#stnAlu)" stroke-width="18" stroke-linecap="round"/>

  <!-- Top Laptop Riser Tray (ventilated platform tilted 18 degrees) -->
  <polygon points="130,200 470,200 440,110 160,110" fill="url(#stnAlu)" stroke="#475569" stroke-width="2.5"/>

  <!-- Heat Dissipation Aeration Cutouts in Tray -->
  <rect x="220" y="130" width="160" height="15" rx="7" fill="#0f172a"/>
  <rect x="200" y="155" width="200" height="15" rx="7" fill="#0f172a"/>

  <!-- Front Curved Lip Hooks with Silicone Pads -->
  <path d="M140 200 L140 216 Q140 222 146 222 L180 222 Q186 222 186 216 L186 200" fill="url(#stnAlu)" stroke="#334155" stroke-width="2"/>
  <rect x="144" y="202" width="38" height="12" rx="3" fill="#38bdf8" opacity="0.8"/>

  <path d="M414 200 L414 216 Q414 222 420 222 L454 222 Q460 222 460 216 L460 200" fill="url(#stnAlu)" stroke="#334155" stroke-width="2"/>
  <rect x="418" y="202" width="38" height="12" rx="3" fill="#38bdf8" opacity="0.8"/>

  <!-- Spec Tag -->
  <rect x="220" y="405" width="160" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="300" y="422" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">CNC AEROSPACE ALLOY</text>
</svg>
