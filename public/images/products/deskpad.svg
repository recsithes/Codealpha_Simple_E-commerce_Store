<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111520"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="dpFelt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dpLeather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#dpBg)"/>

  <!-- Perspective Desk Mat (Extra Large 900x400) -->
  <!-- Mat Shadow -->
  <polygon points="60,340 540,340 500,120 100,120" fill="#000" opacity="0.4" filter="blur(10px)"/>
  
  <!-- Main Wool Felt Surface -->
  <polygon points="70,330 530,330 490,130 110,130" fill="url(#dpFelt)" stroke="#475569" stroke-width="2"/>

  <!-- Precision Stitched Perimeter Edge -->
  <polygon points="78,322 522,322 484,138 116,138" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Full Grain Vegetable-Tanned Leather Accent Trim & Pen Rest (Top-Left) -->
  <polygon points="110,130 240,130 225,180 95,180" fill="url(#dpLeather)" stroke="#d97706" stroke-width="1.5"/>
  <text x="160" y="160" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">AERO EDC</text>

  <!-- Magnetic Cable Channel Holder on top right -->
  <rect x="420" y="145" width="45" height="15" rx="4" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="435" cy="152" r="3" fill="#cbd5e1"/>
  <circle cx="450" cy="152" r="3" fill="#cbd5e1"/>

  <!-- Minimalist Setup Outline on Mat -->
  <!-- Keyboard Silhouette -->
  <polygon points="180,290 380,290 365,210 195,210" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <!-- Mouse Silhouette -->
  <ellipse cx="440" cy="250" rx="22" ry="32" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

  <!-- Spec Tag -->
  <rect x="210" y="385" width="180" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="300" y="402" text-anchor="middle" fill="#d97706" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">MERINO WOOL + LEATHER</text>
</svg>
