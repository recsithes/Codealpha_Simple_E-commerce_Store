<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="hpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>
    <linearGradient id="hpMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="hpAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="hpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#hpBg)"/>
  <!-- Ambient backdrop glow -->
  <circle cx="300" cy="220" r="140" fill="#3b82f6" opacity="0.08" filter="url(#hpGlow)"/>
  
  <!-- Outer Headband Arch -->
  <path d="M190 230 C190 120 410 120 410 230" fill="none" stroke="url(#hpMetal)" stroke-width="22" stroke-linecap="round"/>
  <!-- Inner Cushion Padding -->
  <path d="M210 210 C210 135 390 135 390 210" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
  <path d="M230 185 C230 145 370 145 370 185" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>

  <!-- Left Hinge & Slider -->
  <rect x="180" y="215" width="20" height="45" rx="5" fill="url(#hpMetal)"/>
  <rect x="184" y="225" width="12" height="25" rx="3" fill="#0f172a"/>
  
  <!-- Right Hinge & Slider -->
  <rect x="400" y="215" width="20" height="45" rx="5" fill="url(#hpMetal)"/>
  <rect x="404" y="225" width="12" height="25" rx="3" fill="#0f172a"/>

  <!-- Left Ear Cup Assembly -->
  <g transform="rotate(8 190 290)">
    <!-- Yoke -->
    <path d="M175 250 C160 270 160 310 175 330" fill="none" stroke="url(#hpMetal)" stroke-width="8" stroke-linecap="round"/>
    <!-- Outer Cup Body -->
    <ellipse cx="205" cy="290" rx="42" ry="60" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <!-- Memory Foam Pad -->
    <ellipse cx="212" cy="290" rx="32" ry="52" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <!-- Accent Ring -->
    <ellipse cx="198" cy="290" rx="28" ry="44" fill="none" stroke="url(#hpAccent)" stroke-width="3" opacity="0.9"/>
    <!-- Center Aluminum Faceplate -->
    <circle cx="198" cy="290" r="16" fill="#0f172a" stroke="url(#hpMetal)" stroke-width="2"/>
    <!-- Mic port / ANC vent -->
    <circle cx="198" cy="275" r="2" fill="#60a5fa"/>
  </g>

  <!-- Right Ear Cup Assembly -->
  <g transform="rotate(-8 410 290)">
    <!-- Yoke -->
    <path d="M425 250 C440 270 440 310 425 330" fill="none" stroke="url(#hpMetal)" stroke-width="8" stroke-linecap="round"/>
    <!-- Outer Cup Body -->
    <ellipse cx="395" cy="290" rx="42" ry="60" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <!-- Memory Foam Pad -->
    <ellipse cx="388" cy="290" rx="32" ry="52" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <!-- Accent Ring -->
    <ellipse cx="402" cy="290" rx="28" ry="44" fill="none" stroke="url(#hpAccent)" stroke-width="3" opacity="0.9"/>
    <!-- Center Aluminum Faceplate -->
    <circle cx="402" cy="290" r="16" fill="#0f172a" stroke="url(#hpMetal)" stroke-width="2"/>
    <!-- Mic port / ANC vent -->
    <circle cx="402" cy="275" r="2" fill="#60a5fa"/>
  </g>

  <!-- Sound Stage Acoustic Waveform Accents -->
  <path d="M120 280 Q100 290 120 300" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  <path d="M100 270 Q80 290 100 310" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.2"/>
  <path d="M480 280 Q500 290 480 300" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  <path d="M500 270 Q520 290 500 310" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.2"/>

  <!-- Audio Spec Badge Tag -->
  <rect x="230" y="390" width="140" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="300" y="407" text-anchor="middle" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">40MM BIO-CELLULOSE</text>
</svg>
