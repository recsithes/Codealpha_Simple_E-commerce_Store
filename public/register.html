<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PremiumStore</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">PremiumStore</a>
            <div class="nav-links">
                <a href="/login.html">Login</a>
            </div>
        </nav>
    </header>

    <main class="container animate-fade-in">
        <div class="auth-container">
            <h2>Create Account</h2>
            <p style="color:var(--text-muted); margin-bottom:2rem;">Join us to start shopping</p>
            
            <form id="register-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary auth-btn">Register</button>
            </form>
            <p style="text-align:center; margin-top:1.5rem; font-size:0.875rem;">
                Already have an account? <a href="/login.html" style="color:var(--primary); font-weight:500;">Log in here</a>
            </p>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await res.json();
                
                if (res.ok) {
                    showToast('Registration successful! Please log in.');
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    showToast(data.error || 'Registration failed');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showToast('Registration error');
            }
        });
    </script>
</body>
</html>
