<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account // AERO Hardware</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display:flex; flex-direction:column; min-height:100dvh;">
    <!-- Global Header -->
    <header class="site-header">
        <div class="container">
            <div class="nav-inner">
                <a href="/" class="brand-logo">
                    <div class="brand-logo-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                    </div>
                    <span>AERO</span>
                    <span class="brand-logo-badge">LOCAL</span>
                </a>
                <div class="nav-actions">
                    <a href="/login.html" class="nav-btn">Sign In</a>
                    <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line></svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container" style="flex:1; display:flex; align-items:center; justify-content:center; padding:3rem 1.5rem;">
        <div class="modal-content" style="max-width:460px; position:static; box-shadow:var(--shadow-elevated);">
            <div style="text-align:center; margin-bottom:2rem;">
                <div class="brand-logo-icon" style="width:48px; height:48px; margin:0 auto 1rem; border-radius:14px;">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                </div>
                <h2 style="font-size:1.8rem; font-weight:800; letter-spacing:-0.03em;">Create Your Account</h2>
                <p style="color:var(--text-secondary); font-size:0.9rem; margin-top:0.25rem;">Join the local high-performance hardware community</p>
            </div>

            <!-- Quick Auto Fill -->
            <div style="background:var(--bg-main); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:0.9rem 1rem; margin-bottom:1.75rem; display:flex; align-items:center; justify-content:space-between;">
                <div>
                    <span style="font-size:0.75rem; color:var(--accent); font-weight:700; text-transform:uppercase;">Quick Testing</span>
                    <div style="font-size:0.85rem; color:var(--text-secondary);">Prefill registration details</div>
                </div>
                <button type="button" class="btn btn-secondary btn-sm" onclick="fillRegisterFields()" id="btn-prefill-reg">
                    Prefill
                </button>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label" for="reg-username">Username</label>
                    <input type="text" id="reg-username" class="form-input" placeholder="e.g. alex_rivera" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-input" placeholder="alex.rivera@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="padding:0.85rem; margin-top:1.5rem;" id="btn-submit-register">
                    Complete Registration
                </button>
            </form>

            <p style="text-align:center; margin-top:1.5rem; font-size:0.875rem; color:var(--text-secondary);">
                Already have an account? <a href="/login.html" style="color:var(--accent); font-weight:600; text-decoration:none;">Sign in here</a>
            </p>
        </div>
    </main>

    <!-- App Scripts -->
    <script src="/js/app.js"></script>
    <script>
        function fillRegisterFields() {
            const rand = Math.floor(100 + Math.random() * 900);
            document.getElementById('reg-username').value = `local_user_${rand}`;
            document.getElementById('reg-email').value = `user${rand}@example.com`;
            document.getElementById('reg-password').value = 'password123';
            showToast('Registration details generated!');
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const submitBtn = document.getElementById('btn-submit-register');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Registering Account...';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await res.json();
                if (res.ok) {
                    showToast('Account created successfully! Logging you in...');
                    // Auto login immediately
                    const loginRes = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    if (loginRes.ok) {
                        const loginData = await loginRes.json();
                        setAuthSession(loginData.token, loginData.user);
                        setTimeout(() => window.location.href = '/', 800);
                    } else {
                        setTimeout(() => window.location.href = '/login.html', 1000);
                    }
                } else {
                    showToast(data.error || 'Registration failed', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Complete Registration';
                }
            } catch (err) {
                console.error(err);
                showToast('Registration network error', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Complete Registration';
            }
        });
    </script>
</body>
</html>
