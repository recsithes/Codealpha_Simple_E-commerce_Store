<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders // AERO Hardware</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Global Header -->
    <header class="site-header">
        <div class="container">
            <div class="nav-inner">
                <a href="/" class="brand-logo">
                    <div class="brand-logo-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                    </div>
                    <span>AERO</span>
                    <span class="brand-logo-badge">LOCAL</span>
                </a>

                <div class="nav-search">
                    <span class="search-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </span>
                    <input type="text" id="site-search-input" placeholder="Search acoustic, mechanical, titanium EDC..." autocomplete="off">
                    <span class="search-kbd">/</span>
                </div>

                <div class="nav-actions" id="nav-auth-links"></div>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top:2.5rem; padding-bottom:5rem;">
        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:2rem; flex-wrap:wrap; gap:1rem;">
            <div>
                <h1 style="font-size:2.25rem; font-weight:800; letter-spacing:-0.03em; margin-bottom:0.4rem;">Order History & Tracking</h1>
                <p style="color:var(--text-secondary);">Track your local precision hardware shipments in real-time.</p>
            </div>
            <a href="/" class="btn btn-secondary btn-sm">Explore Catalog</a>
        </div>

        <div id="orders-list-container">
            <p style="color:var(--text-muted);">Loading your order history...</p>
        </div>
    </main>

    <!-- App Scripts -->
    <script src="/js/app.js"></script>
    <script>
        async function loadOrders() {
            const token = getAuthToken();
            const container = document.getElementById('orders-list-container');
            if (!token) {
                container.innerHTML = `
                    <div style="text-align:center; padding:4rem 1rem; background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:var(--radius-md);">
                        <div style="font-size:2.5rem; margin-bottom:1rem;">🔐</div>
                        <h3 style="font-size:1.35rem; margin-bottom:0.5rem;">Authentication Required</h3>
                        <p style="color:var(--text-secondary); margin-bottom:1.5rem;">Please log in to view past orders and tracking.</p>
                        <a href="/login.html" class="btn btn-primary">Sign In</a>
                    </div>
                `;
                return;
            }

            try {
                const res = await fetch('/api/orders', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Failed to fetch orders');
                const orders = await res.json();

                if (orders.length === 0) {
                    container.innerHTML = `
                        <div style="text-align:center; padding:4.5rem 1rem; background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:var(--radius-md);">
                            <div style="font-size:3rem; margin-bottom:1rem; opacity:0.6;">📦</div>
                            <h2 style="font-size:1.4rem; font-weight:700; margin-bottom:0.5rem;">No orders placed yet</h2>
                            <p style="color:var(--text-secondary); margin-bottom:1.5rem;">Your local hardware orders will appear here once confirmed.</p>
                            <a href="/" class="btn btn-primary">Browse Hardware Catalog</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = orders.map(order => {
                    let address = { name: 'Alex Rivera', street: '442 Silicon Crest', city: 'Austin', state: 'TX', zip: '78701' };
                    try {
                        if (order.shipping_address) address = JSON.parse(order.shipping_address);
                    } catch (e) {}

                    const itemsList = order.items && order.items.length > 0 ? order.items.map(item => `
                        <div style="display:flex; align-items:center; gap:1rem; padding:0.75rem 0; border-bottom:1px solid var(--border-subtle);">
                            <img src="${item.image_url}" alt="${item.name}" style="width:50px; height:50px; border-radius:6px; object-fit:cover; background:#000;" onerror="this.onerror=null;this.src='/images/placeholder.svg'">
                            <div style="flex:1;">
                                <div style="font-weight:600; font-size:0.95rem;">${item.name}</div>
                                <div style="color:var(--text-muted); font-size:0.8rem;">Qty: ${item.quantity} × $${item.price.toFixed(2)}</div>
                            </div>
                            <div class="font-mono" style="font-weight:700;">$${(item.price * item.quantity).toFixed(2)}</div>
                        </div>
                    `).join('') : '<p style="color:var(--text-muted); font-size:0.85rem;">Items details recorded.</p>';

                    const status = order.status || 'Confirmed';
                    let statusBadgeBg = 'var(--accent)';
                    let statusColor = '#fff';
                    if (status === 'Processing') {
                        statusBadgeBg = 'rgba(245, 158, 11, 0.2)';
                        statusColor = 'var(--accent-amber)';
                    } else if (status === 'Confirmed') {
                        statusBadgeBg = 'rgba(59, 130, 246, 0.2)';
                        statusColor = 'var(--accent)';
                    } else if (status === 'Shipped') {
                        statusBadgeBg = 'rgba(168, 85, 247, 0.2)';
                        statusColor = '#a855f7';
                    } else if (status === 'Delivered') {
                        statusBadgeBg = 'rgba(16, 185, 129, 0.2)';
                        statusColor = 'var(--accent-emerald)';
                    } else if (status === 'Cancelled') {
                        statusBadgeBg = 'rgba(244, 63, 94, 0.2)';
                        statusColor = 'var(--accent-rose)';
                    }

                    const isCancelled = status === 'Cancelled';
                    const isStep1 = true;
                    const isStep2 = !isCancelled && (status === 'Confirmed' || status === 'Shipped' || status === 'Delivered');
                    const isStep3 = !isCancelled && (status === 'Shipped' || status === 'Delivered');
                    const isStep4 = !isCancelled && status === 'Delivered';

                    const timelineHtml = isCancelled ? `
                        <div style="background:rgba(244,63,94,0.1); border:1px solid var(--accent-rose); color:var(--accent-rose); padding:0.85rem 1.25rem; border-radius:var(--radius-sm); font-size:0.9rem; margin-top:0.75rem; display:flex; align-items:center; gap:0.6rem;">
                            <span>⚠️</span> <span>Order cancelled. Reserved inventory has been automatically released back to stock.</span>
                        </div>
                    ` : `
                        <div class="tracking-timeline">
                            <div class="timeline-point ${isStep1 ? 'active' : ''}">
                                <div class="point-dot">✓</div>
                                <span class="point-label">Confirmed</span>
                            </div>
                            <div class="timeline-point ${isStep2 ? 'active' : ''}">
                                <div class="point-dot">📦</div>
                                <span class="point-label">Packing</span>
                            </div>
                            <div class="timeline-point ${isStep3 ? 'active' : ''}">
                                <div class="point-dot">🚚</div>
                                <span class="point-label">Transit</span>
                            </div>
                            <div class="timeline-point ${isStep4 ? 'active' : ''}">
                                <div class="point-dot">🏠</div>
                                <span class="point-label">Delivered</span>
                            </div>
                        </div>
                    `;

                    return `
                        <div style="background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:1.75rem; margin-bottom:1.75rem; box-shadow:var(--shadow-card);">
                            <!-- Order Header -->
                            <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:1rem; padding-bottom:1.25rem; border-bottom:1px solid var(--border-subtle);">
                                <div>
                                    <div style="display:flex; align-items:center; gap:0.6rem;">
                                        <h3 style="font-size:1.3rem; font-weight:800; letter-spacing:-0.02em;">Order #${order.id}</h3>
                                        <span class="card-badge" style="position:static; background:${statusBadgeBg}; color:${statusColor}; border:1px solid ${statusColor}; font-weight:600;">${status}</span>
                                    </div>
                                    <div style="font-size:0.85rem; color:var(--text-muted); margin-top:0.25rem;">
                                        Placed on ${new Date(order.created_at).toLocaleDateString()} at ${new Date(order.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                                    </div>
                                </div>
                                <div style="text-align:right;">
                                    <div style="font-size:0.8rem; color:var(--text-muted);">Total Amount</div>
                                    <div class="current-price" style="font-size:1.5rem;">$${order.total_price.toFixed(2)}</div>
                                </div>
                            </div>

                            <!-- Tracking Bar -->
                            <div style="margin:1.75rem 0;">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
                                    <span style="font-size:0.85rem; font-weight:600; color:var(--text-secondary);">Tracking Code:</span>
                                    <span class="font-mono" style="color:var(--accent); font-weight:600; font-size:0.9rem; cursor:pointer;" onclick="navigator.clipboard.writeText('${order.tracking_code}'); showToast('Tracking code copied!');" title="Click to copy">
                                        ${order.tracking_code || 'TRK-LOCAL-921'} 📋
                                    </span>
                                </div>
                                ${timelineHtml}
                            </div>

                            <!-- Purchased Items List -->
                            <div style="margin-top:1.5rem;">
                                <h4 style="font-size:0.9rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:0.75rem;">Hardware Items</h4>
                                ${itemsList}
                            </div>

                            <!-- Delivery and Summary Grid -->
                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-top:1.5rem; padding-top:1.25rem; border-top:1px solid var(--border-subtle); font-size:0.85rem;">
                                <div>
                                    <div style="font-weight:700; color:var(--text-secondary); margin-bottom:0.25rem;">Ship To:</div>
                                    <div style="color:var(--text-primary); font-weight:600;">${address.name || 'Alex Rivera'}</div>
                                    <div style="color:var(--text-muted);">${address.street || ''}</div>
                                    <div style="color:var(--text-muted);">${address.city || ''}, ${address.state || ''} ${address.zip || ''}</div>
                                </div>
                                <div>
                                    <div style="font-weight:700; color:var(--text-secondary); margin-bottom:0.25rem;">Payment Method:</div>
                                    <div style="color:var(--text-primary); font-weight:600;">${order.payment_method || 'Instant Card'}</div>
                                    <div style="color:var(--accent-emerald); margin-top:0.25rem;">● Local fulfillment verified</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error(e);
                container.innerHTML = '<p style="color:var(--accent-rose);">Error retrieving order history.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
