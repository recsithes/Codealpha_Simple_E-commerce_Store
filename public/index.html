<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Store - Home</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">PremiumStore</a>
            <div class="nav-links" id="nav-auth-links">
                <!-- Populated by app.js -->
            </div>
        </nav>
    </header>

    <main class="container animate-fade-in">
        <h1>Featured Products</h1>
        <div class="product-grid" id="product-grid">
            <!-- Products loaded via JS -->
            <p>Loading products...</p>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        async function loadProducts() {
            try {
                const res = await fetch('/api/products');
                const products = await res.json();
                
                const grid = document.getElementById('product-grid');
                grid.innerHTML = '';
                
                products.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <a href="/product.html?id=${p.id}" style="text-decoration:none; color:inherit; display:flex; flex-direction:column; height:100%;">
                            <img src="${p.image_url}" alt="${p.name}" class="product-img">
                            <div class="product-info">
                                <h3 class="product-name">${p.name}</h3>
                                <p class="product-desc">${p.description.substring(0, 60)}...</p>
                                <div class="product-footer">
                                    <span class="product-price">$${p.price.toFixed(2)}</span>
                                    <button class="btn btn-primary" onclick="event.preventDefault(); addToCart(${p.id})">Add to Cart</button>
                                </div>
                            </div>
                        </a>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('product-grid').innerHTML = '<p>Error loading products. Please try again later.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
