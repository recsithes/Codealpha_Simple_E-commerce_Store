<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Hardware // AERO Hardware</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Global Header -->
    <header class="site-header">
        <div class="container">
            <div class="nav-inner">
                <a href="/" class="brand-logo">
                    <div class="brand-logo-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                    </div>
                    <span>AERO</span>
                    <span class="brand-logo-badge">LOCAL</span>
                </a>

                <div class="nav-search">
                    <span class="search-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </span>
                    <input type="text" id="site-search-input" placeholder="Search acoustic, mechanical, titanium EDC..." autocomplete="off">
                    <span class="search-kbd">/</span>
                </div>

                <div class="nav-actions" id="nav-auth-links"></div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container" style="padding-top:2.5rem; padding-bottom:5rem;">
        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:2rem; flex-wrap:wrap; gap:1rem;">
            <div>
                <h1 style="font-size:2.25rem; font-weight:800; letter-spacing:-0.03em; margin-bottom:0.4rem;">Compare Hardware Specifications</h1>
                <p style="color:var(--text-secondary);">Side-by-side engineering breakdown of acoustics, custom switches, sensors, and aerospace materials.</p>
            </div>
            <div style="display:flex; gap:0.75rem; align-items:center; flex-wrap:wrap;">
                <select id="compare-add-select" class="form-select" style="max-width:240px;" onchange="handleAddCompareFromSelect(this.value)">
                    <option value="">+ Add Product to Compare</option>
                </select>
                <button class="btn btn-secondary btn-sm" onclick="clearAllCompare()">Clear All</button>
            </div>
        </div>

        <div id="compare-matrix-container">
            <p style="color:var(--text-muted); text-align:center; padding:3rem 0;">Loading comparison data...</p>
        </div>
    </main>

    <!-- App Scripts -->
    <script src="/js/app.js"></script>
    <script>
        let allCatalogProducts = [];

        async function initComparePage() {
            try {
                const res = await fetch('/api/products');
                if (!res.ok) throw new Error('Failed to load products');
                allCatalogProducts = await res.json();

                // Populate selector dropdown
                const selectEl = document.getElementById('compare-add-select');
                selectEl.innerHTML = '<option value="">+ Add Product to Compare</option>' + 
                    allCatalogProducts.map(p => `<option value="${p.id}">${p.name} ($${p.price.toFixed(2)})</option>`).join('');

                renderCompareMatrix();
            } catch (e) {
                console.error(e);
                document.getElementById('compare-matrix-container').innerHTML = '<p style="color:var(--accent-rose); text-align:center;">Error loading comparison catalog.</p>';
            }
        }

        function renderCompareMatrix() {
            const container = document.getElementById('compare-matrix-container');
            const ids = getCompareIds();

            // Default to first 2 products if compare list is empty
            if (ids.length === 0) {
                if (allCatalogProducts.length >= 2) {
                    localStorage.setItem('compare_products', JSON.stringify([allCatalogProducts[0].id, allCatalogProducts[1].id]));
                    return renderCompareMatrix();
                }
            }

            const compared = ids.map(id => allCatalogProducts.find(p => p.id === id)).filter(Boolean);

            if (compared.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:4rem 1rem; background:var(--bg-surface); border:1px solid var(--border-subtle); border-radius:var(--radius-md);">
                        <div style="font-size:3rem; margin-bottom:1rem; opacity:0.6;">⚖️</div>
                        <h2 style="font-size:1.35rem; font-weight:700; margin-bottom:0.5rem;">No items selected for comparison</h2>
                        <p style="color:var(--text-secondary); margin-bottom:1.5rem;">Choose products from the dropdown above or click "Compare" on any catalog item.</p>
                        <a href="/" class="btn btn-primary">Browse Hardware Catalog</a>
                    </div>
                `;
                return;
            }

            // Gather all unique specs keys
            const allSpecKeys = new Set();
            compared.forEach(p => {
                let specs = {};
                try {
                    specs = typeof p.specs === 'string' ? JSON.parse(p.specs) : (p.specs || {});
                } catch (e) {}
                Object.keys(specs).forEach(k => allSpecKeys.add(k));
            });

            container.innerHTML = `
                <div class="data-table-wrap">
                    <table class="compare-matrix">
                        <thead>
                            <tr>
                                <th>Hardware Feature</th>
                                ${compared.map(p => `
                                    <th style="vertical-align:top; min-width:220px;">
                                        <div style="display:flex; justify-content:flex-end; margin-bottom:0.5rem;">
                                            <button class="btn btn-secondary btn-sm" onclick="removeCompareItem(${p.id})" title="Remove from comparison" style="padding:0.2rem 0.5rem; font-size:0.75rem;">✕ Remove</button>
                                        </div>
                                        <a href="/product.html?id=${p.id}" style="text-decoration:none; color:inherit;">
                                            <img src="${p.image_url}" alt="${p.name}" style="width:120px; height:120px; object-fit:contain; margin:0 auto 0.75rem; display:block; border-radius:8px; background:var(--bg-main);" onerror="this.onerror=null;this.src='/images/placeholder.svg'">
                                            <div style="font-size:1.05rem; font-weight:700; line-height:1.3; margin-bottom:0.35rem;">${p.name}</div>
                                        </a>
                                        <span class="status-badge" style="background:var(--bg-main); border:1px solid var(--border-subtle); margin-bottom:0.75rem;">${p.category}</span>
                                        <div style="margin-bottom:0.75rem;">
                                            <span style="font-size:1.4rem; font-weight:800; color:var(--accent); font-family:var(--font-mono);">$${p.price.toFixed(2)}</span>
                                            ${p.original_price ? `<span style="text-decoration:line-through; color:var(--text-muted); font-size:0.9rem; margin-left:0.4rem;">$${p.original_price.toFixed(2)}</span>` : ''}
                                        </div>
                                        <button class="btn btn-primary btn-sm btn-block" onclick="addToCart(${p.id})">Add to Bag</button>
                                    </th>
                                `).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><strong>Verified Rating</strong></td>
                                ${compared.map(p => `
                                    <td>
                                        <span class="star-icon">★</span> 
                                        <strong>${p.rating ? p.rating.toFixed(1) : '4.8'}</strong> 
                                        <span style="color:var(--text-muted); font-size:0.8rem;">(${p.review_count || 12} reviews)</span>
                                    </td>
                                `).join('')}
                            </tr>
                            <tr>
                                <td><strong>Inventory Stock</strong></td>
                                ${compared.map(p => `
                                    <td>
                                        <span style="font-weight:700; color:${p.stock <= 5 ? 'var(--accent-rose)' : 'var(--accent-emerald)'};">
                                            ${p.stock <= 5 ? `Only ${p.stock} units left` : `${p.stock} units in stock`}
                                        </span>
                                    </td>
                                `).join('')}
                            </tr>
                            <tr>
                                <td><strong>Tagline & Focus</strong></td>
                                ${compared.map(p => `
                                    <td style="font-size:0.85rem; color:var(--text-secondary); line-height:1.4;">
                                        ${p.tagline || p.description}
                                    </td>
                                `).join('')}
                            </tr>
                            <tr>
                                <td><strong>Badge / Release</strong></td>
                                ${compared.map(p => `
                                    <td>
                                        ${p.badge ? `<span class="card-badge" style="position:static;">${p.badge}</span>` : '—'}
                                    </td>
                                `).join('')}
                            </tr>
                            ${Array.from(allSpecKeys).map(k => `
                                <tr>
                                    <td><strong>${k}</strong></td>
                                    ${compared.map(p => {
                                        let specs = {};
                                        try {
                                            specs = typeof p.specs === 'string' ? JSON.parse(p.specs) : (p.specs || {});
                                        } catch (e) {}
                                        return `<td style="font-size:0.9rem;">${specs[k] || '—'}</td>`;
                                    }).join('')}
                                </tr>
                            `).join('')}
                            <tr>
                                <td><strong>Warranty & Shipping</strong></td>
                                ${compared.map(() => `
                                    <td style="font-size:0.85rem; color:var(--text-secondary);">
                                        2-Year Precision Warranty<br>Same-day Local Ground Dispatch
                                    </td>
                                `).join('')}
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
        }

        function handleAddCompareFromSelect(id) {
            if (!id) return;
            const pid = parseInt(id, 10);
            toggleCompare(pid);
            renderCompareMatrix();
            document.getElementById('compare-add-select').value = '';
        }

        function removeCompareItem(id) {
            toggleCompare(id);
            renderCompareMatrix();
        }

        function clearAllCompare() {
            localStorage.setItem('compare_products', JSON.stringify([]));
            updateCompareCount();
            renderCompareMatrix();
            showToast('Cleared comparison matrix');
        }

        document.addEventListener('DOMContentLoaded', initComparePage);
    </script>
</body>
</html>
