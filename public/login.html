<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In // AERO Hardware</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display:flex; flex-direction:column; min-height:100dvh;">
    <!-- Global Header -->
    <header class="site-header">
        <div class="container">
            <div class="nav-inner">
                <a href="/" class="brand-logo">
                    <div class="brand-logo-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                    </div>
                    <span>AERO</span>
                    <span class="brand-logo-badge">LOCAL</span>
                </a>
                <div class="nav-actions">
                    <a href="/register.html" class="nav-btn">Create Account</a>
                    <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line></svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container" style="flex:1; display:flex; align-items:center; justify-content:center; padding:3rem 1.5rem;">
        <div class="modal-content" style="max-width:440px; position:static; box-shadow:var(--shadow-elevated);">
            <div style="text-align:center; margin-bottom:2rem;">
                <div class="brand-logo-icon" style="width:48px; height:48px; margin:0 auto 1rem; border-radius:14px;">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                </div>
                <h2 style="font-size:1.8rem; font-weight:800; letter-spacing:-0.03em;">Welcome Back</h2>
                <p style="color:var(--text-secondary); font-size:0.9rem; margin-top:0.25rem;">Access your local cart, wishlist, and orders</p>
            </div>

            <!-- 1-Click Demo Fill -->
            <div style="background:var(--bg-main); border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:0.9rem 1rem; margin-bottom:1.75rem; display:flex; align-items:center; justify-content:space-between;">
                <div>
                    <span style="font-size:0.75rem; color:var(--accent); font-weight:700; text-transform:uppercase;">Quick Testing</span>
                    <div style="font-size:0.85rem; color:var(--text-secondary);">Demo account: alex_rivera</div>
                </div>
                <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemoAccount()" id="btn-fill-demo">
                    Autofill
                </button>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="e.g. alex_rivera" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="padding:0.85rem; margin-top:1.5rem;" id="btn-submit-login">
                    Sign In to Store
                </button>
            </form>

            <p style="text-align:center; margin-top:1.5rem; font-size:0.875rem; color:var(--text-secondary);">
                Don't have an account? <a href="/register.html" style="color:var(--accent); font-weight:600; text-decoration:none;">Create one now</a>
            </p>
        </div>
    </main>

    <!-- App Scripts -->
    <script src="/js/app.js"></script>
    <script>
        function fillDemoAccount() {
            document.getElementById('username').value = 'alex_rivera';
            document.getElementById('password').value = 'pass12345';
            showToast('Demo credentials filled!');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('btn-submit-login');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Authenticating...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    setAuthSession(data.token, data.user);
                    showToast(`Welcome back, ${data.user.username}!`);
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 600);
                } else {
                    showToast(data.error || 'Invalid credentials. Register if new.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In to Store';
                }
            } catch (err) {
                console.error(err);
                showToast('Authentication connection error', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In to Store';
            }
        });
    </script>
</body>
</html>
