<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PremiumStore</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">PremiumStore</a>
            <div class="nav-links">
                <a href="/register.html">Register</a>
            </div>
        </nav>
    </header>

    <main class="container animate-fade-in">
        <div class="auth-container">
            <h2>Welcome Back</h2>
            <p style="color:var(--text-muted); margin-bottom:2rem;">Sign in to your account</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary auth-btn">Log In</button>
            </form>
            <p style="text-align:center; margin-top:1.5rem; font-size:0.875rem;">
                Don't have an account? <a href="/register.html" style="color:var(--primary); font-weight:500;">Register here</a>
            </p>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/';
                } else {
                    showToast(data.error || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                showToast('Login error');
            }
        });
    </script>
</body>
</html>
