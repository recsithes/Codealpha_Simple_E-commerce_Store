<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - PremiumStore</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">PremiumStore</a>
            <div class="nav-links" id="nav-auth-links"></div>
        </nav>
    </header>

    <main class="container animate-fade-in">
        <h1>Your Shopping Cart</h1>
        <div id="cart-content">
            <p>Loading cart...</p>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        async function loadCart() {
            const token = getAuthToken();
            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            try {
                const res = await fetch('/api/cart', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!res.ok) throw new Error('Failed to load cart');
                const cartItems = await res.json();
                
                const container = document.getElementById('cart-content');
                
                if (cartItems.length === 0) {
                    container.innerHTML = '<p>Your cart is currently empty. <a href="/" style="color:var(--primary)">Continue shopping</a>.</p>';
                    return;
                }

                let total = 0;
                let html = `
                    <table class="cart-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Total</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                cartItems.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    html += `
                        <tr>
                            <td style="display:flex; align-items:center; gap:1rem;">
                                <img src="${item.image_url}" alt="${item.name}" style="width:50px; height:50px; object-fit:cover; border-radius:4px;">
                                <span>${item.name}</span>
                            </td>
                            <td>$${item.price.toFixed(2)}</td>
                            <td>${item.quantity}</td>
                            <td>$${itemTotal.toFixed(2)}</td>
                            <td>
                                <button class="btn btn-danger" style="padding:0.5rem 1rem; font-size:0.875rem;" onclick="removeFromCart(${item.cart_item_id})">Remove</button>
                            </td>
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                    </table>
                    <div class="cart-actions">
                        <div style="text-align:right; width:100%;">
                            <p class="cart-total">Total: $${total.toFixed(2)}</p>
                            <button class="btn btn-primary" onclick="checkout()">Proceed to Checkout</button>
                        </div>
                    </div>
                `;
                
                container.innerHTML = html;

            } catch (error) {
                console.error('Error loading cart:', error);
                document.getElementById('cart-content').innerHTML = '<p>Error loading cart.</p>';
            }
        }

        async function removeFromCart(cartItemId) {
            const token = getAuthToken();
            try {
                const res = await fetch(`/api/cart/${cartItemId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    showToast('Item removed from cart');
                    updateNav();
                    loadCart();
                }
            } catch (error) {
                console.error('Error removing item:', error);
            }
        }

        async function checkout() {
            const token = getAuthToken();
            try {
                const res = await fetch('/api/orders/checkout', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    showToast('Order placed successfully!');
                    updateNav();
                    document.getElementById('cart-content').innerHTML = `
                        <div style="text-align:center; padding:4rem 0;">
                            <h2>Thank you for your order!</h2>
                            <p>Order ID: #${data.orderId}</p>
                            <a href="/" class="btn btn-primary" style="margin-top:2rem;">Continue Shopping</a>
                        </div>
                    `;
                } else {
                    const error = await res.json();
                    showToast(error.error || 'Checkout failed');
                }
            } catch (error) {
                console.error('Checkout error:', error);
                showToast('Checkout error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
